{% extends "base.html" %}

{% block title %}Add Physical Room | GrandView Hotel & Resort{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-4 py-8">
    <div class="mb-6">
        <a href="{% url 'rooms:room_inventory' %}" class="text-xs font-mono text-amber-400 hover:underline flex items-center space-x-1">
            <span>&larr; Back to Room Inventory</span>
        </a>
        <h1 class="text-2xl font-serif font-bold text-white mt-2">Add Physical Room</h1>
        <p class="text-xs text-slate-400 mt-1">Register a specific physical room number to an assigned room suite type.</p>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-300 mb-1">Room Number (e.g. 105, 204, PH-03)</label>
                <input type="text" name="room_number" required placeholder="205"
                       class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-amber-400 font-mono font-bold focus:outline-none focus:border-amber-500">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase text-slate-300 mb-1">Room Category / Suite Type</label>
                <select name="room_type" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                    {% for rt in room_types %}
                    <option value="{{ rt.id }}">{{ rt.name }} (${{ rt.base_price }}/night)</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase text-slate-300 mb-1">Floor Level</label>
                <input type="number" name="floor" value="1" min="1" max="50" required
                       class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase text-slate-300 mb-1">Initial Status</label>
                <select name="status" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                    {% for st_code, st_label in statuses %}
                    <option value="{{ st_code }}">{{ st_label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase text-slate-300 mb-1">Housekeeping Inspection Notes</label>
                <input type="text" name="housekeeping_notes" placeholder="Brand new furnishings restocked"
                       class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
            </div>

            <div class="pt-4 border-t border-slate-800 flex items-center justify-end space-x-3">
                <a href="{% url 'rooms:room_inventory' %}" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-semibold">
                    Cancel
                </a>
                <button type="submit" class="px-6 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg text-xs shadow">
                    Save Room to Inventory
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
