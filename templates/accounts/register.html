{% extends "base.html" %}

{% block title %}Guest Registration | GrandView Hotel & Resort{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-12">
    <div class="text-center mb-6">
        <h1 class="text-2xl font-serif font-bold text-white">Create Guest Account</h1>
        <p class="text-xs text-slate-400 mt-1">Join GrandView Rewards & unlock member-exclusive nightly rates.</p>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl">
        <form action="{% url 'accounts:register' %}" method="post" class="space-y-4">
            {% csrf_token %}
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-300 mb-1">First Name</label>
                    <input type="text" name="first_name" required placeholder="Alexander"
                           class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-300 mb-1">Last Name</label>
                    <input type="text" name="last_name" required placeholder="Wright"
                           class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase text-slate-300 mb-1">Email Address</label>
                <input type="email" name="email" required placeholder="alexander@example.com"
                       class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase text-slate-300 mb-1">Phone Number</label>
                <input type="tel" name="phone_number" placeholder="+1 (555) 019-2831"
                       class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase text-slate-300 mb-1">Password (min 6 characters)</label>
                <input type="password" name="password" required minlength="6" placeholder="••••••••"
                       class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
            </div>

            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-lg text-sm transition">
                Create Account & Continue
            </button>
        </form>

        <div class="mt-4 pt-4 border-t border-slate-800 text-center text-xs text-slate-400">
            Already registered? <a href="{% url 'accounts:login' %}" class="text-amber-400 hover:underline">Sign in here</a>
        </div>
    </div>
</div>
{% endblock %}
