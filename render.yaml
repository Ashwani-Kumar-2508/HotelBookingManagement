services:
  - type: web
    name: grandview-hotel-pms
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py seed_hotel_data && python manage.py collectstatic --noinput"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: PAYMENT_SANDBOX_ENABLED
        value: "True"
      - key: TAX_RATE_PERCENT
        value: "12.0"
      - key: SERVICE_FEE_PERCENT
        value: "5.0"
      - key: HOLD_EXPIRY_MINUTES
        value: "15"
