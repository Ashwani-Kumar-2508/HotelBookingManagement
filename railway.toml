[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python manage.py migrate --noinput && python manage.py seed_hotel_data && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[variables]]
name = "DEBUG"
value = "False"

[[variables]]
name = "ALLOWED_HOSTS"
value = ".railway.app,localhost,127.0.0.1"

[[variables]]
name = "PAYMENT_SANDBOX_ENABLED"
value = "True"

[[variables]]
name = "TAX_RATE_PERCENT"
value = "12.0"

[[variables]]
name = "SERVICE_FEE_PERCENT"
value = "5.0"

[[variables]]
name = "HOLD_EXPIRY_MINUTES"
value = "15"
